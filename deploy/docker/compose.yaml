services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    command: gateway run
    restart: unless-stopped
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY in deploy/docker/.env}
      HERMES_DASHBOARD: "0"
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - ./.state/hermes:/opt/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G